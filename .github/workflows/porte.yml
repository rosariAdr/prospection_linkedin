# La porte (AGENTS §5) : la même commande qu'en local, à chaque PR vers dev ou main et à chaque
# push sur ces branches. Elle comprend le contrôle anti-fuite (tests/test_anti_fuite.py).
name: porte

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: porte-${{ github.ref }}
  cancel-in-progress: true

jobs:
  porte:
    name: porte (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 : la version minimale annoncée (AGENTS §7) ; 3.13 : une version récente
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Porte
        run: python -m pytest tests -q
